{% extends "base.html" %}
{% block title %}Edit Payroll{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px">
  <div class="panel-header">Edit Payroll — {{ user.full_name if user else '' }} · {{ rec.month }}/{{ rec.year }}</div>
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Basic</label><input name="basic" type="number" step="0.01" value="{{ rec.basic }}"></div>
        <div class="form-group"><label>Allowance</label><input name="allowance" type="number" step="0.01" value="{{ rec.allowance }}"></div>
        <div class="form-group"><label>OT Hours</label><input name="ot_hours" type="number" step="0.01" value="{{ rec.ot_hours }}"></div>
        <div class="form-group"><label>OT Pay</label><input name="ot_pay" type="number" step="0.01" value="{{ rec.ot_pay }}"></div>
        <div class="form-group"><label>Unpaid Leave Ded.</label><input name="unpaid_leave_deduction" type="number" step="0.01" value="{{ rec.unpaid_leave_deduction }}"></div>
        <div class="form-group"><label>Late Deduction</label><input name="late_deduction" type="number" step="0.01" value="{{ rec.late_deduction }}"></div>
        <div class="form-group"><label>Early Deduction</label><input name="early_deduction" type="number" step="0.01" value="{{ rec.early_deduction }}"></div>
        <div class="form-group"><label>Food Deduction</label><input name="food_deduction" type="number" step="0.01" value="{{ rec.food_deduction }}"></div>
        <div class="form-group"><label>Fine</label><input name="fine_deduction" type="number" step="0.01" value="{{ rec.fine_deduction }}"></div>
        <div class="form-group"><label>Advance Recovery</label><input name="advance_deduction" type="number" step="0.01" value="{{ rec.advance_deduction }}"></div>
        <div class="form-group"><label>Other Deduction</label><input name="other_deduction" type="number" step="0.01" value="{{ rec.other_deduction }}"></div>
        {% if current_user.role_code in ('super_admin', 'admin') %}
        <div class="form-group"><label>Status</label>
          <select name="status">
            <option value="running" {% if rec.status=='running' %}selected{% endif %}>Running</option>
            <option value="final" {% if rec.status=='final' %}selected{% endif %}>Final</option>
          </select>
        </div>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('payroll.view_record', rid=rec.id) }}" class="btn btn-outline">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
