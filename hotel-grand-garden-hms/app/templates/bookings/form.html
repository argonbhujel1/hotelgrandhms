{% extends "base.html" %}
{% block title %}New Booking{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px">
  <div class="panel-header">New Booking</div>
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Guest Name</label><input name="guest_name" required></div>
        <div class="form-group"><label>Phone</label><input name="phone"></div>
        <div class="form-group"><label>Email</label><input name="email" type="email"></div>
        <div class="form-group"><label>Room</label>
          <select name="room_id" required>
            {% for r in rooms %}<option value="{{ r.id }}">{{ r.number }} — {{ r.room_type }} (Rs. {{ r.price }})</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Check-in</label><input name="check_in" type="datetime-local" required></div>
        <div class="form-group"><label>Check-out</label><input name="check_out" type="datetime-local" required></div>
        <div class="form-group"><label>Guests</label><input name="num_guests" type="number" value="1" min="1"></div>
        <div class="form-group"><label>Advance (mandatory)</label><input name="advance_amount" type="number" step="0.01" required></div>
        <div class="form-group"><label>Total Amount</label><input name="total_amount" type="number" step="0.01" value="0"></div>
        <div class="form-group"><label>Status</label>
          <select name="status"><option value="confirmed">Confirmed</option><option value="pending">Pending</option></select>
        </div>
      </div>
      <div class="form-group"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary">Create Booking</button>
    </form>
  </div>
</div>
{% endblock %}
