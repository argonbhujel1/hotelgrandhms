{% extends "base.html" %}
{% block title %}Manual Order{% endblock %}
{% block content %}
<h2 style="margin-bottom:1rem">Add Manual Order</h2>
<div class="panel" style="max-width:640px">
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Source</label>
          <select name="source" id="manSource" onchange="var s=this.value;document.getElementById('manRoom').style.display=s==='ROOM'?'block':'none';document.getElementById('manTable').style.display=s==='TABLE'?'block':'none';">
            <option value="COUNTER">Counter</option>
            <option value="ROOM">Room</option>
            <option value="TABLE">Table</option>
          </select>
        </div>
        <div class="form-group" id="manRoom" style="display:none"><label>Room</label>
          <select name="room_id">{% for r in rooms %}<option value="{{ r.id }}">{{ r.number }}</option>{% endfor %}</select>
        </div>
        <div class="form-group" id="manTable" style="display:none"><label>Table</label>
          <select name="table_id">{% for t in tables %}<option value="{{ t.id }}">{{ t.number }}</option>{% endfor %}</select>
        </div>
        <div class="form-group"><label>Customer (optional)</label><input name="customer_name"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
      <h3 style="margin:1rem 0 .5rem;font-size:1rem">Items</h3>
      {% for i in items %}
      <div style="display:flex;gap:.75rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--border)">
        <input type="hidden" name="item_id" value="{{ i.id }}">
        <span style="flex:1">{{ i.name }} <small style="color:var(--muted)">Rs. {{ i.price }}</small></span>
        <input type="number" name="qty" value="0" min="0" style="width:70px;padding:.35rem;border:1px solid var(--border);border-radius:6px">
      </div>
      {% else %}
      <p style="color:var(--muted)">No menu items. Add menu first.</p>
      {% endfor %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Order</button>
        <a href="{{ url_for('orders.list_orders') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
