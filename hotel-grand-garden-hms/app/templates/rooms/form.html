{% extends "base.html" %}
{% block title %}{{ 'Edit' if room else 'Add' }} Room{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px">
  <div class="panel-header">{{ 'Edit' if room else 'Add' }} Room</div>
  <div class="panel-body">
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Room Number</label><input name="number" value="{{ room.number if room else '' }}" required></div>
        <div class="form-group"><label>Type</label>
          <select name="room_type">
            {% for t in ['Standard','Deluxe','Suite','Family'] %}
            <option {% if room and room.room_type==t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Price (Rs.)</label><input name="price" type="number" step="0.01" value="{{ room.price if room else '0' }}"></div>
        <div class="form-group"><label>Status</label>
          <select name="status">
            {% for s in ['available','occupied','reserved','maintenance','disabled'] %}
            <option value="{{ s }}" {% if room and room.status==s %}selected{% endif %}>{{ s|title }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea name="description" rows="2">{{ room.description if room else '' }}</textarea></div>
      <div class="form-group"><label>Amenities</label><input name="amenities" value="{{ room.amenities if room else '' }}" placeholder="WiFi, AC, TV..."></div>
      <div class="form-group"><label>Image</label>
        <input type="file" name="image" accept="image/*">
        {% if room and room.image_path %}
        <div style="margin-top:.5rem"><img src="{{ url_for('static', filename=room.image_path) }}" style="max-height:80px;border-radius:8px"></div>
        {% endif %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('rooms.list_rooms') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
