{% extends "base.html" %}
{% block title %}Working Hours{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px">
  <div class="panel-header">Working Hours & OT</div>
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Work Start</label><input name="work_start" value="{{ s.work_start }}"></div>
        <div class="form-group"><label>Work End</label><input name="work_end" value="{{ s.work_end }}"></div>
        <div class="form-group"><label>Required Daily Hours</label><input name="required_daily_hours" type="number" step="0.5" value="{{ s.required_daily_hours }}"></div>
        <div class="form-group"><label>Grace (minutes)</label><input name="grace_period_minutes" type="number" value="{{ s.grace_period_minutes }}"></div>
        <div class="form-group"><label>Working Days / Month</label><input name="working_days_per_month" type="number" value="{{ s.working_days_per_month }}"></div>
        <div class="form-group"><label>OT Multiplier</label><input name="overtime_multiplier" type="number" step="0.1" value="{{ s.overtime_multiplier }}"></div>
      </div>
      <label><input type="checkbox" name="late_fine_enabled" value="1" {% if s.late_fine_enabled %}checked{% endif %}> Late fine</label><br>
      <label><input type="checkbox" name="early_fine_enabled" value="1" {% if s.early_fine_enabled %}checked{% endif %}> Early checkout fine</label><br>
      <label><input type="checkbox" name="overtime_enabled" value="1" {% if s.overtime_enabled %}checked{% endif %}> Overtime enabled</label><br>
      <label><input type="checkbox" name="overtime_salary_enabled" value="1" {% if s.overtime_salary_enabled %}checked{% endif %}> Overtime salary (pays OT)</label>
      <div style="margin-top:1rem"><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>
</div>
{% endblock %}
