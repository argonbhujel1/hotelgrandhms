{% extends "base.html" %}
{% block title %}{{ 'Edit' if user else 'Add' }} Staff{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px">
  <div class="panel-header">{{ 'Edit' if user else 'Add' }} Staff</div>
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Full Name</label><input name="full_name" value="{{ user.full_name if user else '' }}" required></div>
        {% if not user %}
        <div class="form-group"><label>Username</label><input name="username" required></div>
        {% endif %}
        <div class="form-group"><label>Email</label><input name="email" type="email" value="{{ user.email if user else '' }}" required></div>
        <div class="form-group"><label>Phone</label><input name="phone" value="{{ user.phone if user else '' }}"></div>
        <div class="form-group"><label>Employee ID</label><input name="employee_id" value="{{ user.employee_id if user else '' }}"></div>
        <div class="form-group"><label>Department</label><input name="department" value="{{ user.department if user else '' }}"></div>
        <div class="form-group"><label>Role</label>
          <select name="role_id" required>
            {% for r in roles %}
            <option value="{{ r.id }}" {% if user and user.role_id == r.id %}selected{% endif %}>{{ r.name }}</option>
            {% endfor %}
          </select>
        </div>
        {% if not user %}
        <div class="form-group"><label>Password</label><input name="password" type="password" value="changeme123"></div>
        <div class="form-group"><label>Basic Salary</label><input name="basic_salary" type="number" step="0.01"></div>
        <div class="form-group"><label>Allowance</label><input name="allowance" type="number" step="0.01" value="0"></div>
        <div class="form-group"><label>Work Start (optional)</label><input name="work_start" placeholder="10:00"></div>
        <div class="form-group"><label>Work End (optional)</label><input name="work_end" placeholder="18:00"></div>
        <div class="form-group"><label>Required Daily Hours</label><input name="required_daily_hours" type="number" step="0.5" placeholder="8"></div>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if user else 'Create' }}</button>
      {% if user %}
      <a href="{{ url_for('staff.profile', uid=user.id) }}" class="btn btn-outline">Cancel</a>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
