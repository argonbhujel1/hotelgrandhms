{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px">
  <div class="panel-header">Reset Password — {{ user.full_name }}</div>
  <div class="panel-body">
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem">Creates a new password and ends all active sessions for this staff.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
      <a href="{{ url_for('staff.profile', uid=user.id) }}" class="btn btn-outline">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
