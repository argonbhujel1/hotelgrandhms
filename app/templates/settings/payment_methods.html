{% extends "base.html" %}
{% block title %}Payment Methods{% endblock %}
{% block content %}
<h2 style="margin-bottom:1rem">Payment Methods</h2>
<div class="panel" style="max-width:520px;margin-bottom:1rem">
  <div class="panel-body">
    <form method="post" style="display:flex;gap:.5rem;flex-wrap:wrap">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="name" placeholder="Name" required style="flex:1;padding:.5rem;border:1px solid var(--border);border-radius:6px">
      <input name="code" placeholder="code" style="width:100px;padding:.5rem;border:1px solid var(--border);border-radius:6px">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
  </div>
</div>
<div class="panel">
  <div class="panel-body table-wrap">
    <table class="data">
      <thead><tr><th>Name</th><th>Code</th><th>Active</th><th>Edit</th><th></th></tr></thead>
      <tbody>
      {% for m in methods %}
        <tr>
          <td>
            <form method="post" action="{{ url_for('settings.edit_payment_method', mid=m.id) }}" style="display:flex;gap:.4rem;align-items:center">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input name="name" value="{{ m.name }}" style="padding:.35rem;border:1px solid var(--border);border-radius:6px;width:140px">
              <button class="btn btn-outline btn-sm" type="submit">Save</button>
            </form>
          </td>
          <td>{{ m.code }}</td>
          <td>{% if m.is_active %}<span class="badge badge-available">Yes</span>{% else %}<span class="badge badge-disabled">No</span>{% endif %}</td>
          <td>{{ m.description or '—' }}</td>
          <td>
            <form method="post" action="{{ url_for('settings.toggle_payment_method', mid=m.id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="btn btn-sm {% if m.is_active %}btn-outline{% else %}btn-primary{% endif %}" type="submit">
                {% if m.is_active %}Disable{% else %}Enable{% endif %}
              </button>
            </form>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
