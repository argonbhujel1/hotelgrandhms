{% extends "base.html" %}
{% block title %}Permissions · {{ user.full_name }}{% endblock %}
{% block content %}
<h2>Permissions — {{ user.full_name }}</h2>
<p style="color:var(--muted);margin-bottom:1rem">Role defaults are pre-checked. Extra grants beyond role can be selected.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="panel">
    <div class="panel-body" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem">
      {% for p in all_perms %}
      <label style="font-size:.85rem;display:flex;gap:.4rem;align-items:center">
        <input type="checkbox" name="perm" value="{{ p.id }}"
          {% if p.id in role_perm_ids or extra.get(p.id) %}checked{% endif %}
          {% if p.id in role_perm_ids %}disabled{% endif %}>
        {{ p.code }}
        {% if p.id in role_perm_ids %}<small style="color:var(--muted)">(role)</small>{% endif %}
      </label>
      {% endfor %}
    </div>
  </div>
  <button type="submit" class="btn btn-primary" style="margin-top:1rem">Save Extra Permissions</button>
</form>
{% endblock %}
