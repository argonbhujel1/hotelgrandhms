{% extends "base.html" %}
{% block title %}Leave{% endblock %}
{% block content %}
<h2 style="margin-bottom:1rem">Leave Request</h2>
<div class="panel" style="max-width:520px;margin-bottom:1rem">
  <div class="panel-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Leave Date</label><input type="date" name="leave_date" required></div>
      <div class="form-group"><label>Type</label>
        <select name="leave_type_id">{% for t in types %}<option value="{{ t.id }}">{{ t.name }} {% if t.is_paid %}(Paid){% else %}(Unpaid){% endif %}</option>{% endfor %}</select>
      </div>
      <div class="form-group"><label>Mode</label>
        <select name="leave_mode">
          <option value="full">Full Day</option>
          <option value="first_half">First Half</option>
          <option value="second_half">Second Half</option>
        </select>
      </div>
      <div class="form-group"><label>Reason</label><textarea name="reason" rows="2"></textarea></div>
      <button class="btn btn-primary" type="submit">Submit Leave</button>
    </form>
  </div>
</div>
<div class="panel">
  <div class="panel-header">My Requests</div>
  <div class="panel-body table-wrap">
    <table class="data">
      <thead><tr><th>Date</th><th>Mode</th><th>Status</th></tr></thead>
      <tbody>
      {% for r in requests %}
        <tr>
          <td>{{ r.leave_date }}</td>
          <td>{{ r.leave_mode }}</td>
          <td><span class="badge badge-{{ r.status }}">{{ r.status }}</span></td>
        </tr>
      {% else %}
        <tr><td colspan="3">No leave requests.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
