<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Print — {{ label }}</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 24px; color: #111; }
    h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .08em; }
    h2 { font-size: 28px; margin: 8px 0; color: #c9a227; }
    .label { font-size: 22px; font-weight: 800; margin: 12px 0; }
    img { width: 220px; height: 220px; }
    .hint { margin-top: 12px; font-size: 14px; color: #333; line-height: 1.45; max-width: 280px; margin-left: auto; margin-right: auto; }
    .sub { margin-top: 6px; font-size: 12px; color: #666; }
    @media print {
      .no-print { display: none !important; }
      body { padding: 8px; }
    }
  </style>
</head>
<body onload="window.print()">
  <div class="no-print" style="margin-bottom:16px">
    <button onclick="window.print()">Print</button>
    <button onclick="window.close()">Close</button>
  </div>
  <h1>HOTEL GRAND GARDEN</h1>
  <div class="label">{{ label }}</div>
  <img src="{{ url_for('rooms.qr_image', qr_id=qr.id) }}" alt="QR {{ label }}">
  <p class="hint"><strong>Scan to order</strong><br>Please make an order from here — it's a humble request.</p>
  <p class="sub">Thank you · Hotel Grand Garden</p>
</body>
</html>
