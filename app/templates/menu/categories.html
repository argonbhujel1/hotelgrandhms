{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h2 style="margin-bottom:1rem">Menu Categories</h2>
<div class="panel" style="max-width:480px;margin-bottom:1rem">
  <div class="panel-body">
    <form method="post" action="{{ url_for('menu.add_category') }}" style="display:flex;gap:.5rem">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="name" placeholder="Category name" required style="flex:1;padding:.5rem;border:1px solid var(--border);border-radius:6px">
      <input name="sort_order" type="number" value="0" style="width:70px;padding:.5rem;border:1px solid var(--border);border-radius:6px">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
  </div>
</div>
<div class="panel">
  <div class="panel-body table-wrap">
    <table class="data">
      <thead><tr><th>Name</th><th>Order</th><th>Active</th></tr></thead>
      <tbody>
      {% for c in categories %}
        <tr><td>{{ c.name }}</td><td>{{ c.sort_order }}</td><td>{% if c.is_active %}Yes{% else %}No{% endif %}</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
