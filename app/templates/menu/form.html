{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Menu Item{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px">
  <div class="panel-header">{{ 'Edit' if item else 'Add' }} Menu Item</div>
  <div class="panel-body">
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Name</label><input name="name" value="{{ item.name if item else '' }}" required></div>
      <div class="form-group"><label>Category</label>
        <select name="category_id">
          <option value="">—</option>
          {% for c in categories %}<option value="{{ c.id }}" {% if item and item.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Price (VAT inclusive)</label><input name="price" type="number" step="0.01" value="{{ item.price if item else '0' }}" required></div>
      <div class="form-group"><label>Description</label><textarea name="description" rows="2">{{ item.description if item else '' }}</textarea></div>
      <div class="form-group"><label>Image</label>
        <input type="file" name="image" accept="image/*">
        {% if item and item.image_path %}
        <div style="margin-top:.5rem"><img src="{{ url_for('static', filename=item.image_path) }}" alt="" style="max-height:80px;border-radius:8px"></div>
        {% endif %}
      </div>
      <div class="form-group"><label>Sort Order</label><input name="sort_order" type="number" value="{{ item.sort_order if item else 0 }}"></div>
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin:1rem 0">
        <label><input type="checkbox" name="is_available" value="1" {% if not item or item.is_available %}checked{% endif %}> Available</label>
        <label><input type="checkbox" name="show_on_website" value="1" {% if not item or item.show_on_website %}checked{% endif %}> Website</label>
        <label><input type="checkbox" name="show_on_qr" value="1" {% if not item or item.show_on_qr %}checked{% endif %}> QR Menu</label>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
