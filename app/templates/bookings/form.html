{% extends "base.html" %}
{% block title %}New Booking{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px">
  <div class="panel-header">New Booking</div>
  <div class="panel-body">
    <form method="post" id="hms-booking-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Guest Name</label><input name="guest_name" required></div>
        <div class="form-group"><label>Phone</label><input name="phone"></div>
        <div class="form-group"><label>Email</label><input name="email" type="email"></div>
        <div class="form-group"><label>Room</label>
          <select name="room_id" id="room_id" required>
            {% for r in rooms %}
            <option value="{{ r.id }}" data-price="{{ r.price or 0 }}">{{ r.number }} — {{ r.room_type }} (Rs. {{ r.price }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Check-in</label><input name="check_in" id="check_in" type="datetime-local" required></div>
        <div class="form-group"><label>Check-out</label><input name="check_out" id="check_out" type="datetime-local" required></div>
        <div class="form-group"><label>Guests</label><input name="num_guests" type="number" value="1" min="1"></div>
        <div class="form-group"><label>Nights</label><input id="nights_display" type="text" readonly value="—" style="background:#f5f5f5"></div>
        <div class="form-group"><label>Advance (mandatory)</label><input name="advance_amount" id="advance_amount" type="number" step="0.01" required></div>
        <div class="form-group"><label>Total Amount (auto)</label><input name="total_amount" id="total_amount" type="number" step="0.01" value="0" readonly style="background:#f5f5f5"></div>
        <div class="form-group"><label>Status</label>
          <select name="status"><option value="confirmed">Confirmed</option><option value="pending">Pending</option></select>
        </div>
      </div>
      <div class="form-group"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
      <p class="muted" id="calc-hint">Select room and dates — total calculates automatically.</p>
      <button type="submit" class="btn btn-primary">Create Booking</button>
    </form>
  </div>
</div>
<script>
(function(){
  var room=document.getElementById('room_id');
  var ci=document.getElementById('check_in');
  var co=document.getElementById('check_out');
  var total=document.getElementById('total_amount');
  var nightsEl=document.getElementById('nights_display');
  var hint=document.getElementById('calc-hint');
  function calc(){
    if(!room||!ci||!co||!ci.value||!co.value) return;
    var price=parseFloat(room.options[room.selectedIndex].getAttribute('data-price')||'0')||0;
    var a=new Date(ci.value), b=new Date(co.value);
    var ms=b-a;
    if(ms<=0){ nightsEl.value='Invalid'; total.value=0; return; }
    var nights=Math.max(1, Math.ceil(ms/(24*60*60*1000)));
    nightsEl.value=nights+' night(s)';
    var t=Math.round(price*nights*100)/100;
    total.value=t;
    if(hint) hint.textContent='Rs. '+price.toLocaleString()+' × '+nights+' night(s) = Rs. '+t.toLocaleString();
  }
  if(room) room.addEventListener('change', calc);
  if(ci) ci.addEventListener('change', calc);
  if(co) co.addEventListener('change', calc);
})();
</script>
{% endblock %}
